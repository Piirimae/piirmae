<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Kuuvaated</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Stiilid laadimisketta jaoks, et Sa ei peaks style.css faili puutuma -->
    <style>
        .loader-konteiner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            font-family: sans-serif;
            color: #555;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f1c40f; /* Kollane/kuldne toon nagu Sinu nuppudel */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* UUS: Paindlik jaluse paigutus kontaktide ja nupu jaoks */
        .vaatleja-footer {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .footer-kontakt {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .footer-kontakt p {
            margin: 0;
        }
        /* Pulsi nupu stiil */
        .btn-pulss {
            background: #f1c40f;
            color: #000;
            border: 1px solid #d4af37;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-pulss:hover {
            background: #f39c12;
            transform: translateY(-1px);
        }
        .btn-pulss:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="page-kuuvaated">

<header class="header">
    <div id="kasutajaNimi"></div>
    <div class="header-actions">
        <button id="logoutBtn" class="btn-small">Logi välja</button>
    </div>
</header>

<main class="container">
    <h2>Kuuvaated – jooksva kuu reaalne seis</h2>
    <div id="vaateReziim" class="vaate-reziim">Režiim: Ainult lugemiseks (Kassatabeli hetkeseis)</div>

    <!-- Siia sisse joonistub tabel. Vaikimisi kuvatakse siin kohe laadimisketast -->
    <div id="kuuvaadeTabeliKoht" class="table-wrapper">
        <div id="laadija" class="loader-konteiner">
            <div class="spinner"></div>
            <p>Laen kassatabeli viimast seisundit, palun oota...</p>
        </div>
    </div>

    <!-- PARANDATUD JALUS: Kontaktid vasakul, Pulsi nupp paremal -->
    <footer class="vaatleja-footer">
        <div class="footer-kontakt">
            <p><strong>Abi ja küsimused:</strong> Inge Piirimäe (superadmin)</p>
            <p><strong>E-post:</strong> piirimaeinge@gmail.com | <strong>Telefon:</strong> +372 5555 5555</p>
        </div>
        
        <!-- UUS: Otsetee analüütika lehele -->
        <div class="footer-tegevused">
            <button onclick="window.location='pulss.html'" class="btn-pulss">
                📈 Piirimäe Pulss Analüütika
            </button>
        </div>
    </footer>
</main>

<!-- Skriptid -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script type="module" src="kuuvaated.js"></script>

</body>
</html>
