<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Logimine...</title>
    <script type="module">
        import { sb } from "./supabase.js";

        const process = async () => {
            // Ootame, kuni Supabase laeb URL-ist sisselogimise andmed sisse
            const { data: { session }, error } = await sb.auth.getSession();

            if (error) {
                console.error("Sessiooni viga:", error);
                alert("Sisselogimine ebaõnnestus.");
                window.location.href = "index.html";
                return;
            }

            if (session && session.user) {
                const email = session.user.email.toLowerCase().trim();

                try {
                    // Küsime andmebaasist kiiresti selle e-maili rolli
                    const { data: kasutaja, error: dbError } = await sb
                        .from("kasutajad")
                        .select("roll")
                        .eq("email", email)
                        .maybeSingle();

                    const roll = kasutaja ? kasutaja.roll : "vaatleja";

                    // 🚀 AUTOMAATNE REEDIREKT VASTAVALT ROLLELE:
                    if (roll === "vaatleja") {
                        console.log("Kasutaja on vaatleja, suunan otse kuuvaadetesse...");
                        window.location.href = "kuuvaated.html";
                    } else {
                        console.log("Kasutaja on administraator, suunan fuajeesse...");
                        window.location.href = "fuajee.html";
                    }
                } catch (e) {
                    console.error("Viga rolli tuvastamisel callbackis:", e);
                    window.location.href = "kuuvaated.html"; // Igaks juhuks turvalisem vaade
                }
            } else {
                window.location.href = "index.html";
            }
        };

        process();
    </script>
</head>
<body>
    Töötlen sisselogimist, palun oota...
</body>
</html>
