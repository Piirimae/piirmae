<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Logimine...</title>
    <script type="module">
        import { sb } from "./supabase.js";

        const process = async () => {
            // Ootame, kuni Supabase loeb URL-ist sisselogimise andmed sisse
            const { data: { session }, error } = await sb.auth.getSession();

            if (error) {
                console.error("Sessiooni viga:", error);
                alert("Sisselogimine ebaõnnestus.");
                window.location.href = "index.html";
                return;
            }

            if (session) {
                // Sisselogimine õnnestus -> suuname fuajeesse
                window.location.href = "fuajee.html";
            } else {
                // Kui millegipärast sessiooni ei tekkinud, igaks juhuks kontrollime uuesti poole sekundi pärast
                setTimeout(async () => {
                    const checkAgain = await sb.auth.getSession();
                    if (checkAgain.data.session) {
                        window.location.href = "fuajee.html";
                    } else {
                        alert("Sessioon aegus või on vigane.");
                        window.location.href = "index.html";
                    }
                }, 500);
            }
        };

        process();
    </script>
</head>
<body>
    Töötlen sisselogimist, palun oota...
</body>
</html>
